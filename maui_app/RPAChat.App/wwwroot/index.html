<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RPAChat.App</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        Se ha producido un error.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">&times;</a>
    </div>

    <script>
        window.rpaChat = {
            scrollToLatest: (elementId) => {
                const element = document.getElementById(elementId);
                if (!element) {
                    return;
                }

                element.scrollTo({
                    top: element.scrollHeight,
                    behavior: "smooth"
                });
            },
            bindPromptSubmit: (elementId, dotNetHelper) => {
                const element = document.getElementById(elementId);
                if (!element) {
                    return;
                }

                if (element.rpaChatPromptSubmitHandler) {
                    element.removeEventListener("keydown", element.rpaChatPromptSubmitHandler);
                }

                element.rpaChatPromptSubmitHandler = (event) => {
                    if (
                        event.key !== "Enter" ||
                        event.shiftKey ||
                        event.ctrlKey ||
                        event.altKey ||
                        event.metaKey ||
                        event.isComposing
                    ) {
                        return;
                    }

                    event.preventDefault();
                    dotNetHelper.invokeMethodAsync("SubmitPromptFromKeyboardAsync");
                };

                element.addEventListener("keydown", element.rpaChatPromptSubmitHandler);
            },
            unbindPromptSubmit: (elementId) => {
                const element = document.getElementById(elementId);
                if (!element || !element.rpaChatPromptSubmitHandler) {
                    return;
                }

                element.removeEventListener("keydown", element.rpaChatPromptSubmitHandler);
                delete element.rpaChatPromptSubmitHandler;
            }
        };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
